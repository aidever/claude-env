name: Build panel
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
      - name: Test
        working-directory: panel
        run: go vet ./... && go test ./...
      - name: Cross-compile
        working-directory: panel
        run: |
          ver="${GITHUB_REF_NAME}"
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$ver" \
              -o "dist/claude-env-panel-$os-$arch$ext" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: claude-env-panel
          path: panel/dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: panel/dist/*
